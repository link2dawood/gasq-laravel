name: Vendor buyer workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  vendor-workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, intl, gd, zip, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan view:cache
      - run: php -d memory_limit=512M vendor/bin/phpunit -c phpunit-vendor-workflow.xml
