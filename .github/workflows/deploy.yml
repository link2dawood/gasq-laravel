name: Deploy to Server (beta)

# Auto-deploy on every push to main. You can also trigger it manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: true

env:
  DEPLOY_PATH: /home/u196501019/domains/getasecurityquotenow.com/public_html/beta

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. PHP + Composer (build production vendor/ on the runner)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, gd, zip, pdo, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 3. Node + build front-end assets (laravel-mix -> public/build, public/css, public/js)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run production

      # 4. Deploy the built project to the server over SSH (rsync, password auth, custom port)
      - name: Install rsync + sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage/app' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/logs' \
            --exclude='tests' \
            --exclude='.DS_Store' \
            --exclude='public/videos' \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/"

      # 5. Run post-deploy artisan commands on the server
      - name: Run post-deploy commands
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p "${{ secrets.SSH_PORT }}" -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            bash -s -- "${{ env.DEPLOY_PATH }}" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          if [ ! -e public/storage ] && [ ! -L public/storage ]; then
            mkdir -p storage/app/public
            ln -s "$PWD/storage/app/public" public/storage
          fi
          php artisan queue:restart
          php artisan currency:refresh
          php scripts/verify_report_deployment.php
          if ! php artisan appraisals:preflight; then
            echo 'Scheduling setup needs attention; see preflight results above.'
          fi
          if crontab -l 2>/dev/null | grep -qE 'artisan[[:space:]]+schedule:(run|work)'; then
            echo 'Laravel scheduler: present in deployment user crontab'
          else
            echo 'Laravel scheduler: not observed in deployment user crontab; verify hosting scheduler before appraisal activation'
          fi
          if pgrep -f '[a]rtisan (queue:work|horizon)' >/dev/null; then
            echo 'Queue worker: observed'
          else
            echo 'Queue worker: not observed; verify hosting worker before appraisal activation'
          fi
          printf '{"commit":"%s"}\n' "$2" > public/deployment.json
          REMOTE
